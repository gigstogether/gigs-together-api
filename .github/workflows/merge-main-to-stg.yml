name: Merge main to stg

on:
  push:
    branches:
      - main

jobs:
  merge-main-to-stg:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge main into stg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          source_title="$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq 'map(select(.merged_at != null and .base.ref == "main")) | first | .title // empty'
          )"

          if [ -z "$source_title" ]; then
            source_title="$(git log -1 --format=%s "$GITHUB_SHA")"
          fi

          git checkout stg
          git merge main -m "chore: merge main into stg [automated]: $source_title"
          git push origin stg
